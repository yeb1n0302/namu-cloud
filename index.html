<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹사이트 정상 작동 확인</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            border: 1px solid #334155;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: #38bdf8;
        }

        p {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .status-box {
            background-color: #0f172a;
            border: 1px solid #0284c7;
            color: #38bdf8;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #22c55e;
        }

        .counter-box {
            margin-bottom: 8px;
        }

        .count-display {
            font-size: 3rem;
            font-weight: bold;
            color: #f8fafc;
            margin-bottom: 16px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        button {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:active {
            transform: scale(0.98);
        }

        button.reset {
            background-color: #475569;
        }

        button.reset:hover {
            background-color: #334155;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Netlify 배포 성공!</h1>
        <p>웹사이트가 정상적으로 작동하고 있습니다.<br>아래 버튼을 눌러 동작 테스트를 해보세요.</p>

        <div class="status-box">
            <span class="status-dot"></span>
            <span>서버 연결 상태: 정상</span>
        </div>

        <div class="counter-box">
            <div class="count-display" id="count">0</div>
            <div class="btn-group">
                <button onclick="increaseCount()">카운트 증가</button>
                <button class="reset" onclick="resetCount()">초기화</button>
            </div>
        </div>
    </div>

    <script>
        let count = 0;
        const countElement = document.getElementById('count');

        function increaseCount() {
            count++;
            countElement.textContent = count;
        }

        function resetCount() {
            count = 0;
            countElement.textContent = count;
        }
    </script>

</body>
</html>
